[project]
name = "tteso-market-opentes"
version = "1.0.0"
description = "Mercado transativo do OpenTES (time TTESO): modelos de otimizacao dos agentes, decomposicao dual, fase de operacao e liquidacao"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Time TTESO, GREI-UFC" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "pyomo>=6.9",
    "matplotlib>=3.8",
]

# O solver nao entra aqui: o padrao e o IBM CPLEX, cuja licenca academica e
# pessoal. Ver a secao "Solver" do README.

[project.scripts]
tteso-mercado = "market_opentes.dual:main"
tteso-operacao = "market_opentes.operation:main"
tteso-figuras = "market_opentes.figuras:main"

[dependency-groups]
# Bibliotecas dos exercicios de FUNDAMENTACAO_TEORICA (meta-heuristicas,
# programacao linear e Mosaik). Instale com `uv sync --group fundamentacao`.
fundamentacao = [
    "haversine==2.9.0",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "plotly==6.4.0",
    "seaborn==0.13.2",
    "streamlit==1.51.0",
    "tables==3.10.2",
    "pymoo==0.6.1.5",
    "pyomo==6.9.5",
    "pyswarms==1.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["market_opentes"]

[tool.setuptools.package-data]
market_opentes = ["dados/ieee13/*"]
