site_name: tteso-market-opentes
site_description: Documentação técnica do mercado transativo do OpenTES (time TTESO), executável sem os demais simuladores
site_url: "https://grei-ufc.github.io/tteso-market-opentes/"
repo_url: "https://github.com/grei-ufc/tteso-market-opentes"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/grei-colors.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - def_list

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            # As docstrings do projeto nao anotam tipos nas secoes Args/Returns;
            # sem isto, o build --strict falha por aviso de estilo, nao de conteudo.
            docstring_options:
              warnings: false
            show_source: true
            show_root_heading: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            members_order: source

extra:
  social:
    - icon: fontawesome/brands/github
      link: "https://github.com/grei-ufc/tteso-market-opentes"

nav:
  - Início: index.md
  - Primeiros Passos:
      - getting-started/installation.md
      - getting-started/first-negotiation.md
  - Tutoriais:
      - tutorials/operation-phase.md
      - tutorials/compare-formulations.md
  - Guias:
      - how-to-guides/configure-solver.md
      - how-to-guides/update-case-data.md
      - how-to-guides/calibrate-price.md
      - how-to-guides/figures-from-co-simulation.md
      - how-to-guides/run-fundamentals.md
  - Referência:
      - reference/cli.md
      - reference/environment-variables.md
      - reference/output-files.md
      - reference/data-files.md
      - API (gerada):
          - reference/api/index.md
          - reference/api/case.md
          - reference/api/models.md
          - reference/api/negotiation.md
          - reference/api/settlement.md
          - reference/api/figures.md
  - Conceitos:
      - explanation/market-model.md
      - explanation/repositories.md
  - Contribuir:
      - contributing/development-setup.md
      - contributing/documentation.md
  - Changelog: changelog.md
  - Citação: citation.md
  - Licença: license.md
